#@TYPE: Machine
#@NAME: cv64a6-zcu111
#@SOC: cv64a6 zcu111
#@DESCRIPTION: Machine configuration for CV64A6 on the AMD ZCU111 PL DDR4 platform

require conf/machine/include/riscv/tune-riscv.inc

MACHINE_FEATURES = "ext2 ext3 serial"
MACHINEOVERRIDES =. "cv64a6-zcu111:"

KERNEL_IMAGETYPE = "Image"
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
PREFERRED_VERSION_linux-yocto = "5.10.7%"

EXTRA_IMAGEDEPENDS += "opensbi"

# Bundle a RAM rootfs INTO the kernel Image. Root cause confirmed on board:
# OpenSBI v0.9 (fpga/cva6) strips linux,initrd-* from /chosen during its FDT
# fixup, so an external initrd passed via the DTB never reaches Linux. Bundling
# embeds the rootfs in the Image and removes any dependence on /chosen.
# Dedicated image avoids a circular dependency with cva6-zcu111-image.
INITRAMFS_IMAGE = "cva6-zcu111-initramfs"
INITRAMFS_IMAGE_BUNDLE = "1"

RISCV_SBI_PLAT = "fpga/cva6"
# Keep RISCV_SBI_PAYLOAD unset: this machine uses fw_jump and loads Linux separately.
RISCV_SBI_FDT ?= "cv64a6_zcu111.dtb"
KERNEL_DEVICETREE ?= "openhwgroup/${RISCV_SBI_FDT}"

SERIAL_CONSOLES = "115200;ttyS0"

IMAGE_FSTYPES += "cpio.gz ext4"
IMAGE_BOOT_FILES ?= "fw_jump.bin ${KERNEL_IMAGETYPE} ${RISCV_SBI_FDT}"

UBOOT_ENTRYPOINT = "0x80200000"
UBOOT_DTB_LOADADDRESS = "0x82200000"
